<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0f172a;
        }
    </style>
</head>

<body class="text-white p-4 max-w-3xl mx-auto">

    <h1 class="text-2xl font-bold mb-2">📚 Klangdoi Fig Ebook / สวนกลางดอยคลังความรู้ 📚</h1>
    <p class="text-gray-400 mb-4">เลือกสายพันธุ์เพื่ออ่าน / ห้ามจำหน่ายเพื่อความรู้ฟรี</p>

    <input id="search" placeholder="ค้นหา..." class="w-full p-3 rounded-xl text-black mb-4" />

    <!-- 🔤 A-Z -->
    <div id="az" class="flex flex-wrap gap-2 mb-4 text-sm"></div>

    <!-- 📋 List -->
    <div id="list" class="space-y-2"></div>

    <!-- 📖 Viewer -->
    <div id="viewer" class="fixed inset-0 bg-black flex flex-col items-center justify-center hidden z-50">

        <button onclick="closeBook()" class="absolute top-4 right-4 text-white text-xl">✕</button>

        <button onclick="toggleFav()" class="absolute top-4 left-4 text-yellow-400 text-xl">★</button>

        <img id="pageImg" class="max-w-full max-h-full object-contain transition-transform duration-200" />

        <div id="pageNum" class="text-white mt-2"></div>

        <div class="absolute bottom-5 flex gap-4">
            <button onclick="prevPage()" class="bg-white text-black px-4 py-2 rounded">◀</button>
            <button onclick="nextPage()" class="bg-white text-black px-4 py-2 rounded">▶</button>
        </div>

    </div>

    <script>
        let data = [], filtered = [];
        let currentIndex = 0;
        let zoom = 1;
        let favs = JSON.parse(localStorage.getItem('favs') || '[]');

        // -------- LOAD --------
        fetch('books.json')
            .then(r => r.json())
            .then(j => {
                data = j.map((item, i) => ({ ...item, id: i }));
                filtered = data;

                renderAZ();
                render();

                // จำหน้าล่าสุด
                let last = localStorage.getItem('lastPage');
                if (last) {
                    openBook(parseInt(last));
                }
            });

        // -------- RENDER --------
        function render() {
            let list = document.getElementById('list');
            list.innerHTML = '';

            filtered.forEach(it => {
                list.innerHTML += `
      <div onclick="openBook(${it.id})"
        class="p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700 flex">
        
        <span class="text-gray-400 w-10">${it.id + 1}.</span>
        <span class="flex-1">${it.name}</span>
      </div>
    `;
            });
        }

        // -------- SEARCH --------
        document.getElementById('search').oninput = e => {
            let q = e.target.value.toLowerCase().trim();

            if (q === '') {
                filtered = data;
            } else {
                filtered = data.filter(x => {
                    let name = x.name.toLowerCase();
                    return name.startsWith(q) || name.split('-').some(w => w.startsWith(q));
                });
            }

            render();
        }

        // -------- A-Z --------
        function renderAZ() {
            let az = document.getElementById('az');
            let letters = [...new Set(data.map(x => x.name[0].toUpperCase()))];

            az.innerHTML = '<button onclick="resetAZ()" class="px-2 py-1 bg-gray-600 rounded">All</button>';

            letters.forEach(l => {
                az.innerHTML += `
      <button onclick="filterAZ('${l}')"
        class="px-2 py-1 bg-slate-700 rounded">${l}</button>
    `;
            });
        }

        function filterAZ(letter) {
            filtered = data.filter(x => x.name[0].toUpperCase() === letter);
            render();
        }

        function resetAZ() {
            filtered = data;
            render();
        }

        // -------- VIEWER --------
        function openBook(index) {
            currentIndex = index;
            zoom = 1;

            document.getElementById('viewer').classList.remove('hidden');
            showPage();
        }

        function showPage() {
            let img = document.getElementById('pageImg');
            img.src = data[currentIndex].file;
            img.style.transform = `scale(${zoom})`;

            document.getElementById('pageNum').innerText =
                (currentIndex + 1) + ' / ' + data.length;

            localStorage.setItem('lastPage', currentIndex);
        }

        function nextPage() {
            if (currentIndex < data.length - 1) {
                currentIndex++;
                zoom = 1;
                showPage();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                zoom = 1;
                showPage();
            }
        }

        function closeBook() {
            document.getElementById('viewer').classList.add('hidden');
        }

        // -------- SWIPE --------
        let startX = 0;
        const img = document.getElementById('pageImg');

        img.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
        });

        img.addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;

            if (startX - endX > 50) nextPage();
            else if (endX - startX > 50) prevPage();
        });

        // -------- ZOOM --------
        img.addEventListener('click', () => {
            zoom = zoom === 1 ? 2 : 1;
            img.style.transform = `scale(${zoom})`;
        });

        // -------- FAVORITE --------
        function toggleFav() {
            if (favs.includes(currentIndex)) {
                favs = favs.filter(x => x !== currentIndex);
            } else {
                favs.push(currentIndex);
            }
            localStorage.setItem('favs', JSON.stringify(favs));
        }
    </script>

</body>

</html>
